name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MirageFox-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Verify no credentials in artifact
        run: |
          JAR=$(ls build/libs/*.jar | head -1)
          unzip -p "$JAR" config.yml > /tmp/packed-config.yml
          if grep -qE '(sk-[A-Za-z0-9]{16,}|Bearer [A-Za-z0-9_-]{24,})' /tmp/packed-config.yml; then
            echo "::error::Credentials leaked into packaged config.yml"
            exit 1
          fi
          echo "Config clean."
